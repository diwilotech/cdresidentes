<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · Portal de residentes</title>
  <script>document.documentElement.setAttribute('data-bs-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')</script>
  <link rel="expect" href="#cdr-ready" blocking="render">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/admin/assets/app.css" rel="stylesheet">
</head>
<body>
  <main class="container-fluid px-3 px-lg-4 py-4" style="max-width:1200px">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
      <div>
        <div class="eyebrow" id="eyebrow">Portal de residentes</div>
        <h1 class="page-title" id="hello">Hola</h1>
        <p class="page-sub" id="sub"></p>
      </div>
      <button class="btn btn-primary" id="pdfBtn"><i class="bi bi-file-earmark-pdf me-1"></i>Cuenta de cobro</button>
    </div>

    <div class="row g-3 mb-3" id="kpis"></div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card mb-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-megaphone me-2 text-primary"></i>Últimos comunicados</span>
            <a href="/portal/comunicados" class="small">Ver todos</a>
          </div>
          <div class="list-group list-group-flush" id="notices"></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card mb-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-calendar2-week me-2 text-primary"></i>Mis próximas reservas</span>
            <a href="/portal/reservas" class="small">Reservar</a>
          </div>
          <div class="list-group list-group-flush" id="bookings"></div>
        </div>
        <div class="card">
          <div class="card-header"><i class="bi bi-lightning-charge me-2 text-primary"></i>Accesos rápidos</div>
          <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action" href="/portal/cartera"><i class="bi bi-cash-stack me-2"></i>Estado de cuenta y pagos</a>
            <a class="list-group-item list-group-item-action" href="/portal/reservas"><i class="bi bi-calendar-plus me-2"></i>Reservar una zona común</a>
            <a class="list-group-item list-group-item-action" href="/portal/mascotas?new=1"><i class="bi bi-heart me-2"></i>Registrar una mascota</a>
            <a class="list-group-item list-group-item-action" href="/portal/unidad"><i class="bi bi-building me-2"></i>Datos de mi unidad y del conjunto</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin/assets/app.js"></script>
  <script src="/admin/assets/cuenta-cobro.js"></script>
  <script>
    (async () => {
      const me = await App.initPortal('inicio');
      if (!me) return;
      const { esc, money } = App;
      const $ = (id) => document.getElementById(id);
      const CAT = { mantenimiento: 'warning', seguridad: 'danger', servicios: 'info', asamblea: 'primary', convivencia: 'success', finanzas: 'secondary', general: 'secondary' };
      const STATUS = { pending: ['Por aprobar', 'warning'], approved: ['Aprobada', 'success'] };
      $('hello').textContent = `Hola, ${(me.user.name || me.user.email).split(' ')[0]}`;

      const kpi = (icon, cls, label, value, extra = '') => `
        <div class="col-6 col-xl-3"><div class="card kpi"><div class="d-flex justify-content-between gap-2">
          <div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${extra}</div>
          <div class="kpi-icon ${cls}"><i class="bi ${icon}"></i></div></div></div></div>`;

      async function load() {
        const u = App.unitInfo();
        $('sub').textContent = u ? `${u.label} · ${u.property_name} · ${App.RELATION[u.relation]}` : '';
        $('eyebrow').textContent = me.business.name;
        let d;
        try { d = await App.api('/home' + App.qs({ unit: u.id }, { withProperty: false })); } catch (err) { return App.fail(err); }
        $('kpis').innerHTML =
          kpi('bi-cash-stack', d.overdue > 0 ? 'red' : '', 'Saldo pendiente', money(d.balance),
            d.overdue > 0 ? `<div class="small text-danger fw-semibold">Vencido ${money(d.overdue)}</div>` : `<div class="small text-success fw-semibold">${d.balance ? 'Al día' : 'Paz y salvo'}</div>`) +
          kpi('bi-calendar-event', 'amber', 'Próximo vencimiento', d.next_due ? App.fmtDate(d.next_due) : '—') +
          kpi('bi-receipt', 'violet', 'Último pago', d.last_paid ? App.fmtDate(d.last_paid) : '—') +
          kpi('bi-heart', '', 'Mascotas', d.pets, `<a class="small" href="${App.link('/portal/mascotas')}">Ver registro</a>`);
        $('notices').innerHTML = d.notices.map((n) => `
          <a class="list-group-item list-group-item-action" href="${App.link('/portal/comunicados')}#${esc(n.id)}">
            <div class="d-flex justify-content-between gap-2"><span class="fw-semibold">${esc(n.title)}</span><span class="small text-body-secondary text-nowrap">${App.fmtDate(n.created_at)}</span></div>
            <div class="small text-body-secondary text-truncate">${App.badge(n.category, CAT[n.category])} ${esc(n.excerpt)}</div></a>`).join('') ||
          '<div class="empty">No hay comunicados publicados.</div>';
        $('bookings').innerHTML = d.bookings.map((b) => `
          <div class="list-group-item d-flex justify-content-between align-items-center gap-2">
            <div><div class="fw-semibold">${esc(b.amenity_name)}</div><div class="small text-body-secondary">${App.fmtDate(b.date, { weekday: true })} · ${esc(b.start_time)}–${esc(b.end_time)}</div></div>
            ${App.badge(...STATUS[b.status])}</div>`).join('') ||
          `<div class="empty">Sin reservas próximas.<br><a class="btn btn-sm btn-outline-primary mt-2" href="${App.link('/portal/reservas')}">Reservar</a></div>`;
      }

      $('pdfBtn').addEventListener('click', () => CuentaCobro.open({ unit: App.currentUnit() }));
      App.onUnit(load);
      await load();
    })();
  </script>
  <span id="cdr-ready" hidden></span>
</body>
</html>
