<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PQRS · CD Residentes</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/admin/assets/app.css" rel="stylesheet">
</head>
<body>
  <main class="container-fluid px-3 px-lg-4 py-4" style="max-width:1400px">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
      <div>
        <div class="eyebrow">Convivencia</div>
        <h1 class="page-title">PQRS</h1>
        <p class="page-sub">Peticiones, quejas, reclamos y sugerencias radicadas por los residentes: ruido, mascotas, parqueaderos y más.</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-ai" href="/admin/asistente?q=Audita%20las%20PQRS%20abiertas%3A%20agr%C3%BApalas%20por%20categor%C3%ADa%2C%20detecta%20patrones%20y%20prop%C3%B3n%20acciones"><i class="bi bi-stars me-1"></i>Auditar con IA</a>
        <button class="btn btn-primary" id="newBtn"><i class="bi bi-plus-lg me-1"></i>Radicar PQRS</button>
      </div>
    </div>

    <div class="row g-3 mb-3" id="kpis"></div>

    <div class="card">
      <div class="filters">
        <div class="input-group grow"><span class="input-group-text"><i class="bi bi-search"></i></span><input type="search" id="q" class="form-control" placeholder="Buscar asunto, quien reporta o unidad"></div>
        <select id="status" class="form-select"><option value="">Estado: todos</option><option value="open">Abiertas</option><option value="in_progress">En gestión</option><option value="closed">Cerradas</option></select>
        <select id="category" class="form-select"><option value="">Categoría: todas</option></select>
      </div>
      <div class="table-responsive">
        <table class="table table-hover table-clickable mb-0">
          <thead><tr><th>Asunto</th><th class="hide-xs">Categoría</th><th class="hide-xs">Unidad</th><th>Estado</th><th class="hide-xs">Radicada</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin/assets/app.js"></script>
  <script>
    (async () => {
      if (!(await App.init('pqrs'))) return;
      const { esc, unitLabel } = App;
      const $ = (id) => document.getElementById(id);
      const CAT = { ruido: 'Ruido', mascotas: 'Mascotas', parqueadero: 'Parqueadero', seguridad: 'Seguridad', mantenimiento: 'Mantenimiento', aseo: 'Aseo', convivencia: 'Convivencia', otro: 'Otro' };
      const KIND = { peticion: 'Petición', queja: 'Queja', reclamo: 'Reclamo', sugerencia: 'Sugerencia' };
      const ST = { open: ['Abierta', 'warning'], in_progress: ['En gestión', 'primary'], closed: ['Cerrada', 'success'] };
      const PRI = { alta: 'danger', normal: 'secondary', baja: 'light' };
      $('category').innerHTML += Object.entries(CAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
      let items = [];
      let timer;

      async function load() {
        let d;
        try { d = await App.api('/pqrs' + App.qs({ q: $('q').value.trim(), status: $('status').value, category: $('category').value })); } catch (err) { return App.fail(err); }
        items = d.items;
        const k = (l, v, cls = '') => `<div class="col-6 col-md-3"><div class="stat-strip ${cls}"><div class="lbl">${l}</div><div class="val fs-5">${v}</div></div></div>`;
        const byCat = {};
        items.filter((q) => q.status !== 'closed').forEach((q) => (byCat[q.category] = (byCat[q.category] || 0) + 1));
        const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
        $('kpis').innerHTML = k('PQRS abiertas', d.stats.open, 'red') + k('Tiempo prom. respuesta', d.stats.avg_hours != null ? `${App.fmtNum(d.stats.avg_hours)} h` : '—') +
          k('Categoría más frecuente', top ? `${CAT[top[0]]} (${top[1]})` : '—', 'violet') + k('Urgentes', items.filter((q) => q.priority === 'alta' && q.status !== 'closed').length, 'red');
        $('rows').innerHTML = items.length ? items.map((q) => `
          <tr data-id="${esc(q.id)}">
            <td><div class="fw-semibold">${q.priority === 'alta' ? '<i class="bi bi-exclamation-triangle-fill text-danger me-1"></i>' : ''}${esc(q.subject)}</div>
              <div class="small text-body-secondary">${esc(KIND[q.kind])}${q.reporter ? ' · ' + esc(q.reporter) : ''}${App.currentProperty() ? '' : ' · ' + esc(q.property_name)}</div></td>
            <td class="hide-xs">${App.badge(CAT[q.category], PRI[q.priority] === 'danger' ? 'danger' : 'secondary')}</td>
            <td class="hide-xs">${q.number ? esc(unitLabel(q)) : '—'}</td>
            <td>${App.badge(ST[q.status][0], ST[q.status][1])}</td>
            <td class="hide-xs small">${App.fmtDate(q.created_at)}</td>
          </tr>`).join('') : '<tr><td colspan="5" class="empty">Sin PQRS registradas.</td></tr>';
      }

      function edit(q) {
        if (!App.properties.length) return App.toast('Primero crea un conjunto', 'warning');
        const { el, form } = App.formDialog({
          title: q ? 'PQRS' : 'Radicar PQRS', size: 'modal-lg',
          data: q || { property_id: App.currentProperty() || App.properties[0].id, kind: 'queja', category: 'ruido', priority: 'normal', status: 'open' },
          extraFooter: q && App.canManage() ? '<button type="button" class="btn btn-outline-danger me-auto" data-del><i class="bi bi-trash"></i></button>' : '',
          fields: `
            <div class="row g-2">
              <div class="col-sm-6"><label class="form-label small">Conjunto</label><select name="property_id" class="form-select" required>${App.propertyOptions()}</select></div>
              <div class="col-sm-6"><label class="form-label small">Unidad</label><select name="unit_id" class="form-select"></select></div>
              <div class="col-6 col-sm-4"><label class="form-label small">Tipo</label><select name="kind" class="form-select">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
              <div class="col-6 col-sm-4"><label class="form-label small">Categoría</label><select name="category" class="form-select">${Object.entries(CAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
              <div class="col-sm-4"><label class="form-label small">Prioridad</label><select name="priority" class="form-select"><option value="baja">Baja</option><option value="normal">Normal</option><option value="alta">Alta</option></select></div>
              <div class="col-sm-8"><label class="form-label small">Asunto *</label><input name="subject" class="form-control" required maxlength="160"></div>
              <div class="col-sm-4"><label class="form-label small">Quién reporta</label><input name="reporter" class="form-control" maxlength="120"></div>
              <div class="col-12"><label class="form-label small">Detalle</label><textarea name="detail" class="form-control" rows="3" maxlength="4000"></textarea></div>
              <div class="col-sm-4"><label class="form-label small">Estado</label><select name="status" class="form-select">${Object.entries(ST).map(([k, [v]]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
              <div class="col-12"><div class="d-flex justify-content-between align-items-end"><label class="form-label small mb-1">Respuesta de la administración</label>
                <button type="button" class="btn btn-sm btn-ai mb-1" data-ai><i class="bi bi-stars me-1"></i>Responder con IA</button></div>
                <textarea name="response" class="form-control" rows="4" maxlength="4000"></textarea></div>
            </div>
            ${q ? '<div class="eyebrow mt-3 mb-1">Evidencias (fotos, PDF)</div><div id="files"></div>' : ''}`,
          onSave: async (d) => {
            if (q) await App.api(`/pqrs/${q.id}`, { method: 'PUT', body: d });
            else await App.api('/pqrs', { method: 'POST', body: d });
            App.toast('PQRS guardada'); load();
          },
        });
        App.bindUnitSelect(form, { selected: q?.unit_id || '' });
        if (q) App.attachments(el.querySelector('#files'), 'pqrs', q.id);
        el.querySelector('[data-ai]').addEventListener('click', async (ev) => {
          const b = ev.currentTarget;
          const f = App.formData(form);
          if (!f.subject) return App.toast('Escribe primero el asunto', 'warning');
          b.disabled = true;
          try {
            const r = await App.api('/ai/draft', { method: 'POST', body: { kind: 'circular', property_id: f.property_id,
              topic: `Respuesta formal de la administración a una ${KIND[f.kind].toLowerCase()} de convivencia (${CAT[f.category]}): "${f.subject}". ${f.detail || ''}. Escribe solo la respuesta dirigida al residente, sin título, citando el manual de convivencia de forma general.` } });
            form.elements.response.value = r.text;
          } catch (err) { App.fail(err); }
          b.disabled = false;
        });
        el.querySelector('[data-del]')?.addEventListener('click', async () => {
          if (!(await App.confirmAction('¿Eliminar esta PQRS?'))) return;
          try { await App.api(`/pqrs/${q.id}`, { method: 'DELETE' }); bootstrap.Modal.getInstance(el).hide(); load(); } catch (err) { App.fail(err); }
        });
      }

      $('rows').addEventListener('click', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr) edit(items.find((x) => x.id === tr.dataset.id)); });
      ['status', 'category'].forEach((id) => $(id).addEventListener('change', load));
      $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 250); });
      $('newBtn').addEventListener('click', () => edit(null));
      App.onProperty(load);
      load();
    })();
  </script>
</body>
</html>
