<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipo · CD Residentes</title>
<meta name="robots" content="noindex">
<!-- Tema guardado: se aplica antes de pintar para que no parpadee (luego /api/me lo confirma) -->
<script>try{var t=JSON.parse(localStorage.getItem('dw_tema')||'{}');document.documentElement.setAttribute('data-dw-tema',t.tema||'turquesa');document.documentElement.setAttribute('data-bs-theme',t.modo||'light')}catch(e){}</script>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/diwilo.css" rel="stylesheet">
<link href="/css/residentes.css" rel="stylesheet">
</head>
<body class="dw">
<div id="dw-shell"></div>
<main class="dw-main" data-titulo="Equipo" data-modulo="equipo">
  <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
    <div>
      <h1 class="page-title">Equipo</h1>
      <p class="page-sub">Las personas que trabajan en la administración: propietario, administradores y equipo (portería, auxiliares).</p>
    </div>
    <button class="btn btn-primary manager" id="addMember"><i class="bi bi-person-plus me-1"></i>Agregar</button>
  </div>
  <div class="card"><div class="list-group list-group-flush" id="team"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/crud.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/residentes.js"></script>
<script>
(async () => {
  if (!(await App.init('equipo', { needsBusiness: false }))) return;
  const { esc } = App;
  const $ = (id) => document.getElementById(id);
  if (!App.canManage()) document.querySelectorAll('.manager').forEach((b) => b.classList.add('d-none'));

      async function loadTeam() {
        const d = await App.api('/team');
        $('team').innerHTML = d.items.map((u) => `
          <div class="list-group-item d-flex align-items-center gap-3">
            <span class="avatar">${esc(App.initials(u.name || u.email))}</span>
            <div class="flex-grow-1 min-w-0"><div class="fw-semibold text-truncate">${esc(u.name || u.email)}${u.id === d.me ? ' <span class="text-body-secondary small">(tú)</span>' : ''}</div>
              <div class="small text-body-secondary text-truncate">${esc(u.email)} · ${esc(App.ROLE[u.role])}${u.has_password ? '' : ' · <span class="text-warning">sin contraseña</span>'}</div></div>
            ${d.canManage && u.role !== 'owner' && u.id !== d.me ? `
              <button class="btn btn-sm btn-outline-secondary" data-invite="${esc(u.id)}" title="Link para crear contraseña"><i class="bi bi-link-45deg"></i></button>
              <button class="btn btn-sm btn-outline-danger" data-remove="${esc(u.id)}" title="Quitar"><i class="bi bi-person-dash"></i></button>` : ''}
          </div>`).join('');
      }

      $('addMember').addEventListener('click', () => App.formDialog({
        title: 'Agregar al equipo', submit: 'Agregar',
        data: { role: 'staff' },
        fields: `
          <div class="mb-2"><label class="form-label small">Correo *</label><input name="email" type="email" class="form-control" required></div>
          <div class="mb-2"><label class="form-label small">Nombre</label><input name="name" class="form-control" maxlength="100"></div>
          <label class="form-label small">Rol</label><select name="role" class="form-select"><option value="staff">Equipo (portería, auxiliar)</option><option value="admin">Administrador</option></select>`,
        onSave: async (d) => {
          const r = await App.api('/team', { method: 'POST', body: d });
          loadTeam();
          if (r.inviteUrl) App.inviteDialog(r.inviteUrl, 'Link para crear la contraseña');
          else App.toast('Agregado: ya tiene contraseña, puede entrar.');
        },
      }));
      $('team').addEventListener('click', async (ev) => {
        const b = ev.target.closest('button');
        if (!b) return;
        try {
          if (b.dataset.invite) { const r = await App.api(`/team/${b.dataset.invite}/invite`, { method: 'POST' }); App.inviteDialog(r.inviteUrl); }
          if (b.dataset.remove && (await App.confirmAction('¿Quitar a esta persona del equipo?'))) { await App.api(`/team/${b.dataset.remove}`, { method: 'DELETE' }); loadTeam(); }
        } catch (err) { App.fail(err); }
      });

  loadTeam().catch(App.fail);
})();
</script>
</body>
</html>
